<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
<style>
:root{--cream:#f5f2ea;--paper:#efebe1;--ink:#151515;--mut:#6d6a62;--wash:#cfcdc5;--line:#1c1c1c;--script:'Sacramento','Mrs Saint Delafield','Brush Script MT','Segoe Script',cursive;--sans:'Montserrat','Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-weight:300;font-size:13.5px;line-height:1.8;color:var(--ink);background:#2b2b2d;overflow-x:hidden}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.defs{position:absolute;width:0;height:0;overflow:hidden}
.bgfx{position:fixed;inset:0;background:#2b2b2d center/cover no-repeat;filter:blur(22px) brightness(.35) grayscale(.6);transform:scale(1.1);z-index:-1}
.app{position:relative;max-width:480px;margin:0 auto;background:var(--cream);min-height:100vh;box-shadow:0 0 80px rgba(0,0,0,.55);overflow:hidden}
.side{display:none}
@media(min-width:1100px){
 .side{display:flex;position:fixed;top:0;bottom:0;left:0;width:calc(50% - 240px);flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f5f2ea;padding:40px}
 .side .e{letter-spacing:.45em;font-size:11px;text-transform:uppercase;opacity:.75}
 .side .n{font-family:var(--script);font-size:92px;line-height:1.1;margin:10px 0}
 .side .d{letter-spacing:.3em;font-size:13px;text-transform:uppercase}
 .side .t{margin-top:22px;font-size:11px;letter-spacing:.25em;opacity:.6;text-transform:uppercase}
}

/* ---------- hiasan ---------- */
.dc{position:absolute;pointer-events:none;z-index:0;overflow:visible}
.sec>*:not(.dc){position:relative;z-index:1}
.wash path.a{fill:var(--wash);fill-opacity:.8}
.wash path.b{fill:none;stroke:#b9b6ad;stroke-width:1.4;stroke-opacity:.55}
.w-v1{top:-10px;right:-34px;width:150px;height:auto}
.w-v2{top:60px;left:-30px;width:130px;height:auto}
.w-b1{top:34px;left:-60px;width:330px}
.w-b2{bottom:30px;right:-70px;width:320px}
.w-h1{bottom:36px;left:-50px;width:300px}
.w-s1{top:30px;right:34px;width:64px}
.w-s2{bottom:110px;left:24px;width:56px}
.sc1{top:-6px;right:-8px;width:130px}
.sc2{top:-6px;left:-8px;width:120px;transform:scaleX(-1)}
.sc3{bottom:-8px;right:-6px;width:110px;transform:scaleY(-1)}
.vl{top:0;left:18px;width:66px}
.dt{width:90px}
.dt.p1{top:80px;left:22px}.dt.p2{top:46px;right:20px}.dt.p3{bottom:90px;right:26px}.dt.p4{bottom:70px;left:22px}

/* ---------- cover ---------- */
.cover{position:fixed;z-index:60;top:0;bottom:0;left:max(0px,calc(50% - 240px));width:min(100%,480px);background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 26px 30px;overflow-y:auto;overflow-x:hidden;transition:transform 1s cubic-bezier(.7,0,.2,1),opacity 1s}
.cover.out{transform:translateY(-101%);opacity:0;pointer-events:none}
.cover>*:not(.dc){position:relative;z-index:1}
.mono{display:inline-flex;align-items:center;justify-content:center;gap:2px;width:62px;height:62px;border:1px solid var(--line);border-radius:50%;font-family:var(--script);font-size:26px;line-height:1;color:var(--ink)}
.mono i{font-style:normal;font-size:17px}
.cover .mono{margin-bottom:6px}
.cover .blob{width:clamp(150px,30vh,240px);margin:10px auto 6px}
.eyebrow{font-size:10px;letter-spacing:.42em;text-transform:uppercase;color:var(--mut);font-weight:400}
.cover .nm{font-family:var(--script);font-size:clamp(64px,20vw,88px);line-height:.95;color:var(--ink);margin:18px 0 18px}
.cover .nm .am{display:block;font-size:.6em;line-height:1;margin:2px 0}
.cover .mono{margin-bottom:10px}
.cover .ln{margin:18px auto}
.cover .mf{margin-bottom:22px}
.cover .tg{font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:400}
.cover .ln{display:block;width:150px;height:1px;background:var(--line);margin:12px auto}
.cover .kp{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut)}
.cover .gs{font-size:15px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin:4px 0 2px;max-width:100%;overflow-wrap:anywhere}
.cover .mf{font-size:9.5px;color:var(--mut);margin-bottom:14px;max-width:290px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--ink);color:var(--cream);border:1px solid var(--ink);padding:13px 28px;font-size:10.5px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;text-decoration:none;transition:.25s;border-radius:0}
.btn:active{transform:scale(.97)}
.btn.o{background:transparent;color:var(--ink)}
.btn.s{padding:10px 18px;font-size:9.5px}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ---------- umum ---------- */
.sec{position:relative;padding:84px 28px;text-align:center;overflow:hidden}
.sec h2{font-family:var(--script);font-weight:400;font-size:58px;line-height:1.05;color:var(--ink)}
.sub{font-size:12px;color:var(--mut);margin:10px auto 34px;max-width:320px}
.cap{font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:400}
.thin{display:block;width:90px;height:1px;background:var(--line);margin:18px auto}
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}

/* ---------- foto organik ---------- */
.blob{position:relative;width:min(72%,250px);aspect-ratio:4/5;margin:0 auto}
.blob::before{content:"";position:absolute;inset:-6% -8% -4% -4%;background:var(--wash);opacity:.8;border-radius:44% 56% 48% 52% / 54% 40% 60% 46%;transform:rotate(-6deg);z-index:0}
.blob .im{position:absolute;inset:0;overflow:hidden;border-radius:56% 44% 52% 48% / 42% 46% 54% 58%;z-index:1;background:var(--wash)}
.blob.r2 .im{border-radius:46% 54% 40% 60% / 56% 38% 62% 44%}
.blob.r2::before{transform:rotate(7deg);border-radius:52% 48% 40% 60% / 44% 56% 44% 56%}
.blob img{width:100%;height:100%;object-fit:cover;object-position:50% 28%;filter:grayscale(.25) contrast(1.03)}

/* ---------- hero ---------- */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:56px 26px 110px}
.hero .blob{width:min(78%,300px);margin:14px auto 0}
.hero .nm{font-family:var(--script);font-size:clamp(56px,17vw,76px);line-height:1;margin:-26px 0 6px;position:relative;z-index:2;text-shadow:0 0 18px var(--cream),0 0 8px var(--cream)}
.hero .tg{font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:400;margin-top:4px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:330px;margin:20px auto 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0}
.cd div{border-left:1px solid var(--line)}
.cd div:first-child{border-left:0}
.cd b{display:block;font-weight:300;font-size:28px;line-height:1.2;letter-spacing:.05em}
.cd span{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--mut)}
.cdn{font-size:12px;letter-spacing:.06em;margin-top:18px}
.scroll{position:relative;margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:9px;letter-spacing:.35em;text-transform:uppercase;color:var(--mut)}
.scroll::after{content:"";width:1px;height:30px;background:var(--line);animation:sc 1.8s infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* ---------- salam (lingkaran coretan) ---------- */
.circ{position:relative;width:100%;max-width:330px;margin:0 auto;padding:62px 38px}
.circ>svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;overflow:visible}
.circ>div{position:relative;z-index:1}
.circ .s1{font-family:var(--script);font-size:40px;line-height:1.1;margin-bottom:8px}
.circ p{font-size:12px;line-height:1.85}

/* ---------- mempelai ---------- */
.pn{font-family:var(--script);font-size:56px;line-height:1.1;margin-top:26px}
.pf{font-size:12px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;margin-top:2px}
.po{font-size:12px;color:var(--mut);margin-top:10px;line-height:1.75}
.po b{font-weight:500;color:var(--ink)}
.ig{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;letter-spacing:.1em;text-decoration:none}
.ig svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.amp{font-family:var(--script);font-size:76px;line-height:1;margin:34px 0 6px}

/* ---------- cerita ---------- */
#cerita{text-align:left;padding-left:86px;padding-right:30px}
.hd3{margin-bottom:34px}
.hd3 .c1,.hd3 .c3{display:block;font-size:34px;letter-spacing:.2em;font-weight:300;text-transform:uppercase;line-height:1.35}
.hd3 .c2{display:block;font-family:var(--script);font-size:56px;line-height:1;margin:-4px 0}
.tli{margin-bottom:34px}
.tli small{font-size:10px;letter-spacing:.34em;text-transform:uppercase;color:var(--mut);font-weight:400}
.tli h3{font-family:var(--script);font-weight:400;font-size:36px;line-height:1.1;margin:2px 0 6px}
.tli p{font-size:12.5px}

/* ---------- acara (gaya menu) ---------- */
.ev{margin:0 auto 38px;max-width:340px}
.ev .lbl{font-size:12px;letter-spacing:.34em;text-transform:uppercase;font-weight:500}
.ev .jd{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);margin-bottom:12px}
.ev .tgl{font-size:13px;letter-spacing:.06em}
.ev .jm{font-size:12px;letter-spacing:.14em;margin-bottom:10px}
.ev .tp{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;margin-top:8px}
.ev .al{font-size:12px;color:var(--mut);margin:2px auto 16px;max-width:280px}
.ev .bt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.ev+.ev::before{content:"";display:block;width:60px;height:1px;background:var(--line);margin:0 auto 38px}
.live{max-width:340px;margin:0 auto}

/* ---------- galeri ---------- */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;cursor:zoom-in;background:var(--wash);filter:grayscale(.2);border-radius:48% 52% 46% 54% / 38% 40% 60% 62%;transition:transform .3s}
.gal img:nth-child(even){border-radius:54% 46% 52% 48% / 58% 42% 58% 42%;margin-top:22px}
.gal img:active{transform:scale(.97)}
.lb{position:fixed;inset:0;z-index:120;background:rgba(14,14,14,.95);display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:84vh;object-fit:contain}
.lb button{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px}
.lb .x{top:18px;right:18px}.lb .p{left:12px;top:50%}.lb .n{right:12px;top:50%}
.lb .c{position:absolute;bottom:22px;color:#fff;font-size:12px;letter-spacing:.2em}

/* ---------- hadiah ---------- */
.bank{margin:0 auto 34px;max-width:340px}
.bank .bn{font-size:12px;letter-spacing:.34em;text-transform:uppercase;font-weight:500}
.bank .no{font-size:26px;font-weight:300;letter-spacing:.1em;margin:6px 0 0;word-break:break-all}
.bank .an{font-size:12px;color:var(--mut);margin-bottom:14px}
.bank .ad{font-size:12.5px;margin:6px 0 14px;line-height:1.7}

/* ---------- ucapan ---------- */
.fm{max-width:360px;margin:0 auto;text-align:left}
.fm label.l{display:block;font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--mut);margin:0 0 2px;font-weight:400}
.fm input[type=text],.fm textarea{width:100%;border:0;border-bottom:1px solid var(--line);padding:10px 2px;font:inherit;font-size:14px;background:transparent;color:var(--ink);outline:0;margin-bottom:20px;border-radius:0}
.fm textarea{min-height:96px;resize:vertical;border:1px solid var(--line);padding:12px;margin-top:6px}
.fm input:focus,.fm textarea:focus{border-color:var(--ink);box-shadow:0 2px 0 var(--ink)}
.rd{display:grid;gap:8px;margin:8px 0 18px}
.rd label{display:flex;align-items:center;gap:10px;border:1px solid #bdb9ae;padding:10px 14px;font-size:12.5px;cursor:pointer}
.rd input{accent-color:var(--ink);width:15px;height:15px}
.rd label:has(input:checked){border-color:var(--ink);background:var(--paper)}
.ck{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--mut);margin-bottom:18px}
.ck input{accent-color:var(--ink);margin-top:5px}
.fm .btn{width:100%}
.cnt{float:right;font-size:10px;color:var(--mut);letter-spacing:0}
.wl{max-width:360px;margin:30px auto 0;max-height:430px;overflow:auto;text-align:left;display:grid;gap:14px;padding:2px;scrollbar-width:thin}
.wi{display:flex;gap:12px;padding:14px 0 14px 14px;border-left:1px solid var(--line);background:rgba(255,255,255,.35)}
.av{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--script);font-size:24px;line-height:1}
.wi b{font-weight:500;font-size:13px;overflow-wrap:anywhere;letter-spacing:.04em}
.wi p{font-size:12.5px;margin-top:2px;overflow-wrap:anywhere;white-space:pre-line}
.bd{display:inline-block;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;padding:1px 8px;border:1px solid var(--line);margin-left:6px;vertical-align:middle}
.bd.t{border-color:#9a9288;color:#7a7268}.bd.r{border-style:dashed}
.wt{display:block;font-size:10.5px;color:var(--mut);margin-top:3px}
.emp{font-size:12.5px;color:var(--mut)}

/* ---------- penutup ---------- */
.end{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:84px 28px 150px}
.end .blob{width:min(66%,240px);margin-bottom:26px}
.end p.t{font-size:12.5px;line-height:1.9;max-width:320px}
.end .nm{font-family:var(--script);font-size:68px;line-height:1.05;margin:16px 0 4px}
.end .w{font-size:11px;letter-spacing:.26em;text-transform:uppercase;margin-top:8px}
.end .ct{margin-top:26px;font-size:12px;max-width:290px;line-height:1.75;padding:22px 26px;position:relative}
.end .ct svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.cr{position:relative;margin-top:44px;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--mut)}


/* ---------- latar foto penuh (awal & penutup) ---------- */
.fotobg{background:#3a3a3a center/cover no-repeat;color:#f5f2ea}
.fotobg::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(15,15,15,.55),rgba(15,15,15,.3) 40%,rgba(15,15,15,.78))}
.fotobg .mono{border-color:#f5f2ea;color:#f5f2ea}
.fotobg .eyebrow,.fotobg .scroll,.fotobg .cr{color:rgba(245,242,234,.85)}
.fotobg .scroll::after{background:#f5f2ea}
.hero.fotobg{justify-content:center;text-align:center}
.hero .nm{margin:18px 0 8px;text-shadow:0 2px 18px rgba(0,0,0,.45);font-size:clamp(64px,20vw,88px)}
.hero .cd{border-color:#f5f2ea}
.hero .cd div{border-color:rgba(245,242,234,.7)}
.hero .cd span{color:rgba(245,242,234,.8)}
.end.fotobg .t,.end.fotobg .w,.end.fotobg .ct{color:#f5f2ea}
.end.fotobg .nm{text-shadow:0 2px 18px rgba(0,0,0,.45)}
.end .ct svg path{stroke:#f5f2ea}

/* ---------- navigasi & musik ---------- */
.nav{position:fixed;z-index:50;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;width:min(92vw,400px);transform:translate(-50%,140%);display:flex;justify-content:space-around;background:rgba(245,242,234,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;padding:6px 8px;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.nav.on{transform:translate(-50%,0)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:999px;font-size:8px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--mut);transition:.25s}
.nav a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--cream);background:var(--ink)}
.mu{position:fixed;z-index:55;right:max(14px,calc(50% - 226px));bottom:calc(86px + env(safe-area-inset-bottom));width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--cream);color:var(--ink);display:none;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.22)}
.mu.on{display:grid}
.mu svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mu.play svg{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;z-index:200;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--ink);color:var(--cream);padding:11px 20px;font-size:12px;opacity:0;pointer-events:none;transition:.35s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.err{padding:60px 24px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

<svg class="defs" aria-hidden="true" focusable="false"><defs>
<filter id="wc" x="-25%" y="-25%" width="150%" height="150%"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G" result="d"/><feGaussianBlur in="d" stdDeviation="0.7"/></filter>
</defs></svg>

<button class="mu" id="mu" aria-label="Musik"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
<nav class="nav" id="nav"></nav>

<script>
(function(){
'use strict';
var D=window.DATA;
if(!D){document.getElementById('app').innerHTML='<div class="err">Data undangan tidak ditemukan. Periksa file data/data-undangan.js</div>';document.body.classList.remove('lock');return;}
var FB=window.FB||{aktif:false};
var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var OFS={WIB:'+07:00',WITA:'+08:00',WIT:'+09:00'};
var ZONA=OFS[D.zona]?D.zona:'WIB';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function tgl(s){var p=String(s||'').split('-');if(p.length<3)return '';var d=new Date(+p[0],+p[1]-1,+p[2]);return HARI[d.getDay()]+', '+(+p[2])+' '+BLN[+p[1]-1]+' '+p[0]}
function jam(s){return String(s||'').replace(':','.')}
function rentang(e){return jam(e.jamMulai)+(e.jamSelesai?' - '+jam(e.jamSelesai):' - selesai')+' '+ZONA}
function wkt(tg,jm){return new Date(tg+'T'+(jm||'00:00')+':00'+OFS[ZONA])}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2800)}
function salin(txt,pesan){
  function ok(){toast(pesan||'Tersalin')}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,fb)}else fb();
  function fb(){var a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Gagal menyalin')}a.remove()}
}
function ago(d){var s=(Date.now()-d.getTime())/1000;if(s<60)return 'baru saja';if(s<3600)return Math.floor(s/60)+' menit lalu';if(s<86400)return Math.floor(s/3600)+' jam lalu';if(s<2592000)return Math.floor(s/86400)+' hari lalu';return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()}

    gcal='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(judul+' '+NAMA)+'&dates='+f(st)+'/'+f(en)+'&details='+encodeURIComponent('Pernikahan '+(pr.nama||PANG)+' & '+(wn.nama||WANG))+'&location='+encodeURIComponent(e.tempat+', '+e.alamat);}catch(x){}
  return '<div class="ev rv d'+idx+'"><div class="lbl">'+esc(judul)+'</div><div class="jd">'+esc(ic)+'</div>'+
   '<div class="tgl">'+esc(tgl(e.tanggal))+'</div><div class="jm">'+esc(rentang(e))+'</div>'+

/* ---------- perilaku ---------- */
function countdown(){
  var el=$('#cd');if(!el||!ak&&!rs)return;
  var tgt=wkt(utama.tanggal,utama.jamMulai).getTime();
  function t(){
    var d=tgt-Date.now();
    if(d<=0){el.style.display='block';el.style.border='0';el.className='cdn rv in';el.textContent='Alhamdulillah, acara telah berlangsung. Terima kasih atas doa Anda.';return}
    var s=Math.floor(d/1000),dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
    el.innerHTML=[[dd,'Hari'],[hh,'Jam'],[mm,'Menit'],[ss,'Detik']].map(function(x){return '<div><b>'+String(x[0]).padStart(2,'0')+'</b><span>'+x[1]+'</span></div>'}).join('');
    setTimeout(t,1000);
  }
  t();
}
function reveal(){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
  $$('.rv').forEach(function(e){io.observe(e)});
}
function nav(){
  var items=[['beranda','home','Awal'],['mempelai','heart','Mempelai'],['acara','cal','Acara'],['galeri','img','Galeri'],['hadiah','gift','Hadiah'],['ucapan','msg','Ucapan']].filter(function(i){return $('#'+i[0])});
  $('#nav').innerHTML=items.map(function(i){return '<a href="#'+i[0]+'" data-s="'+i[0]+'"><svg viewBox="0 0 24 24">'+IC[i[1]]+'</svg>'+i[2]+'</a>'}).join('');
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){$$('#nav a').forEach(function(a){a.classList.toggle('on',a.dataset.s===e.target.id)})}})},{rootMargin:'-45% 0px -50% 0px'});
  items.forEach(function(i){io.observe($('#'+i[0]))});
}
function galeri(){
  var g=$('#gal');if(!g)return;var lb=$('#lb'),im=$('img',lb),c=$('.c',lb),cur=0,L=D.galeri;
  function show(i){cur=(i+L.length)%L.length;im.src=L[cur];c.textContent=(cur+1)+' / '+L.length}
  g.addEventListener('click',function(e){var t=e.target.closest('img');if(!t)return;show(+t.dataset.i);lb.classList.add('on')});
  $('.x',lb).onclick=function(){lb.classList.remove('on')};
  $('.p',lb).onclick=function(){show(cur-1)};$('.n',lb).onclick=function(){show(cur+1)};
  lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('on')});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
  var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){if(x0==null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));x0=null});
}
function musik(){
  var a=$('#aud'),b=$('#mu');
  if(!D.musik){return {mulai:function(){}}}
  a.src=D.musik;var gagal=false;
  a.addEventListener('error',function(){if(!gagal){gagal=true;toast('Musik tidak dapat diputar. Periksa file musik.')}b.classList.remove('play')});
  a.addEventListener('play',function(){b.classList.add('play')});a.addEventListener('pause',function(){b.classList.remove('play')});
  b.onclick=function(){if(a.paused){a.play().catch(function(){toast('Musik tidak dapat diputar. Periksa file musik.')})}else a.pause()};
  return {mulai:function(){b.classList.add('on');a.play().catch(function(){})}};
}

  }
  var seed=(D.ucapan||[]).map(function(u){return {nama:u.nama,isi:u.isi,hadir:u.hadir||'hadir',waktu:new Date(u.waktu||Date.now())}});
  if(!S.ucapanPublik){tampil([], 'Ucapan hanya dapat dibaca oleh mempelai. Terima kasih atas doa Anda.');return}
  if(FB.aktif){FB.daftarUcapan(false).then(function(a){tampil(a)}).catch(function(){tampil(lokal().concat(seed))})}
  else tampil(lokal().concat(seed));
}
function form(){
  var f=$('#fm');if(!f)return;
  $('#fi').addEventListener('input',function(){$('#cnt').textContent=this.value.length+'/300'});
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var nama=$('#fn').value.trim(),isi=$('#fi').value.trim(),hd=(f.querySelector('input[name=hd]:checked')||{}).value||'hadir';
    if(!nama||!isi){toast('Nama dan ucapan wajib diisi');return}
    var btn=$('#fs');btn.disabled=true;
    var u={nama:nama.slice(0,40),isi:isi.slice(0,300),hadir:hd};
    var wa=$('#fw')&&$('#fw').checked;
    function selesai(){
      toast('Ucapan terkirim. Terima kasih!');$('#fi').value='';$('#cnt').textContent='0/300';btn.disabled=false;daftar();
      if(wa){var st={hadir:'Insya Allah hadir',tidak:'Mohon maaf, belum bisa hadir',ragu:'Masih ragu'}[hd];
        window.open('https://wa.me/'+String(D.pemesan.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent('Assalamu\'alaikum, saya '+u.nama+'.\nKonfirmasi kehadiran: '+st+'.\n\nUcapan: '+u.isi),'_blank')}
    }
    if(FB.aktif){FB.kirimUcapan(u).then(selesai).catch(function(){btn.disabled=false;toast('Ucapan gagal terkirim. Coba lagi.')})}
    else{u.waktu=new Date();simpanLokal(u);selesai()}
  });
}

/* ---------- pengaturan dari admin ---------- */
function terapkan(){
  $$('#bank [data-r]').forEach(function(e){e.style.display=S.rek[+e.dataset.r]===false?'none':''});
  if(S.turut&&D.turutMengundang&&D.turutMengundang.length){var t=$('#turut');t.style.display='';$('#tm').innerHTML=D.turutMengundang.map(esc).join('<br>');t.querySelectorAll('.rv').forEach(function(e){e.classList.add('in')})}
}
function muatPengaturan(){
  if(!FB.aktif)return Promise.resolve();
  return FB.pengaturan().then(function(p){if(!p)return;
    if(typeof p.ucapanPublik==='boolean')S.ucapanPublik=p.ucapanPublik;
    if(typeof p.turutTampil==='boolean')S.turut=p.turutTampil;
    if(typeof p.rekening1==='boolean')S.rek[0]=p.rekening1;
    if(typeof p.rekening2==='boolean')S.rek[1]=p.rekening2;
  }).catch(function(){});
}

/* ---------- mulai ---------- */
build();
$('#bgfx').style.backgroundImage=F.sampul?'url('+F.sampul+')':'';
$('#side').innerHTML='<div class="e">The Wedding Of</div><div class="n">'+esc(NAMA)+'</div>'+(utama?'<div class="d">'+esc(tgl(utama.tanggal))+'</div>':'')+(tamu?'<div class="t">Kepada Yth. '+esc(tamu)+'</div>':'');
var M=musik();
reveal();countdown();nav();galeri();form();
muatPengaturan().then(function(){terapkan();daftar()});
$$('[data-cp]').forEach(function(b){b.onclick=function(){salin(b.dataset.cp,'Berhasil disalin')}});
$('#buka').onclick=function(){
  $('#cover').classList.add('out');document.body.classList.remove('lock');M.mulai();
  setTimeout(function(){$('#nav').classList.add('on')},700);window.scrollTo(0,0);
};
})();
</script>
</body>
